# Refreshes src/lib/directory/data/ireland.json (every golf course on the island of Ireland) from
# OpenStreetMap and commits it back. Run it from the Actions tab ("Run workflow"), or it runs by
# itself when the fetch script, the builder or overrides.json change on a branch other than main.
#
# It never pushes to main (a push to main deploys): run from main, it commits to the
# `course-directory-refresh` branch instead, for a pull request.
#
# Security notes (the repo is public): actions pinned to full SHAs; no secrets; the only write is
# the token's own `contents: write`, used for that one commit. Commits made with GITHUB_TOKEN don't
# trigger further workflow runs, so this can't loop.
name: Course directory

on:
  workflow_dispatch:
    inputs:
      allow_drops:
        description: 'Write even if several courses vanished or lack a county (only when the change is real)'
        type: boolean
        default: false
  push:
    branches-ignore: [main]
    paths:
      - scripts/fetch-course-directory.ts
      - src/lib/directory/build.ts
      - src/lib/directory/data/overrides.json
      - .github/workflows/course-directory.yml

permissions:
  contents: write

concurrency:
  group: course-directory-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '24'
  PNPM_VERSION: '12.5.1'

jobs:
  refresh:
    name: Fetch from OpenStreetMap
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Fetch and build the directory
        run: pnpm directory:fetch
        env:
          DIRECTORY_ALLOW_DROPS: ${{ inputs.allow_drops && '1' || '' }}
      - name: Commit the refreshed directory
        env:
          REF_NAME: ${{ github.ref_name }} # via env, never inlined into the script
        run: |
          set -euo pipefail
          if [ -z "$(git status --porcelain -- src/lib/directory/data)" ]; then
            echo "Directory unchanged."
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/lib/directory/data/ireland.json
          git commit -m "Refresh Ireland course directory from OpenStreetMap"
          if [ "$REF_NAME" = "main" ]; then
            git push --force origin HEAD:refs/heads/course-directory-refresh
            echo "::notice::Pushed to course-directory-refresh — open a pull request from it."
          else
            # The branch may have moved while the fetch ran; this commit only touches ireland.json.
            git pull --rebase origin "$REF_NAME"
            git push origin "HEAD:refs/heads/$REF_NAME"
          fi
