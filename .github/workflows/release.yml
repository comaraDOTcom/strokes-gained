# Publishes a GitHub release with the matching section of CHANGELOG.md as the notes. Two ways in:
#
#   1. Push a tag:   git tag -a v0.0.16 -m "0.0.16 — short title" && git push origin v0.0.16
#      The tag message becomes the release title.
#   2. Run it by hand (Actions → Release → Run workflow, on main) with a short title. It reads the
#      version from package.json, creates and pushes the annotated tag itself, then publishes.
#      For releasing from a phone, or from a session that can't push tags.
#
# Either way it refuses (and publishes nothing) if package.json's version doesn't match the tag,
# if CHANGELOG.md has no entry for it, or (by hand) if that tag already exists — so a release can't
# go out undocumented or twice.
name: Release

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      title:
        description: 'Short release title after the version, e.g. "Seasonal backdrops on the Rounds page"'
        required: true
        type: string

permissions:
  contents: write # to push the tag (by hand) and create the release

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Work out the tag (by hand: create and push it from package.json's version)
        env:
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          REF_NAME: ${{ github.ref_name }}
          INPUT_TITLE: ${{ inputs.title }} # via env, never inlined into the script
        run: |
          set -euo pipefail
          if [ "$EVENT" = "workflow_dispatch" ]; then
            if [ "$REF" != "refs/heads/main" ]; then
              echo "::error::Run this on main, not $REF."
              exit 1
            fi
            VERSION=$(node -p "require('./package.json').version")
            TAG="v$VERSION"
            if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null; then
              echo "::error::$TAG already exists. Bump package.json and add a CHANGELOG.md entry first."
              exit 1
            fi
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag -a "$TAG" -m "$VERSION — $INPUT_TITLE"
            git push origin "refs/tags/$TAG"
          else
            TAG="$REF_NAME"
          fi
          echo "TAG=$TAG" >> "$GITHUB_ENV"

      - name: Check the version and extract the changelog entry
        run: |
          set -euo pipefail
          VERSION="${TAG#v}"
          PKG=$(node -p "require('./package.json').version")
          if [ "$PKG" != "$VERSION" ]; then
            echo "::error::Tag $TAG but package.json says $PKG. Bump package.json, commit, and re-tag."
            exit 1
          fi
          # The '## X.Y.Z — date' section, up to the next '## ' heading.
          awk -v v="$VERSION" '
            $0 ~ "^## " v "( |$)" { found=1; next }
            found && /^## / { exit }
            found { print }
          ' CHANGELOG.md > notes.md
          if ! grep -q '[^[:space:]]' notes.md; then
            echo "::error::CHANGELOG.md has no entry for $VERSION. Add a '## $VERSION — YYYY-MM-DD' section."
            exit 1
          fi
          # Title from the annotated tag's message; fall back to the version.
          git fetch --force origin "refs/tags/$TAG:refs/tags/$TAG"
          TITLE=$(git tag -l --format='%(contents:subject)' "$TAG")
          echo "TITLE=${TITLE:-$VERSION}" >> "$GITHUB_ENV"

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --title "$TITLE" --notes-file notes.md   # re-runs just refresh it
          else
            gh release create "$TAG" --title "$TITLE" --notes-file notes.md --verify-tag --latest
          fi
