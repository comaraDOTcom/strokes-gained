# Push a tag like v0.0.16 and this publishes the GitHub release — using the matching section of
# CHANGELOG.md as the notes. It refuses (and publishes nothing) if package.json's version doesn't
# match the tag, or if CHANGELOG.md has no entry for it, so a release can't go out undocumented.
#
#   git tag -a v0.0.16 -m "0.0.16 — short title"   # the tag message becomes the release title
#   git push origin v0.0.16
name: Release

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: write # to create the release

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check the version and extract the changelog entry
        env:
          TAG: ${{ github.ref_name }} # via env, never inlined into the script
        run: |
          set -euo pipefail
          VERSION="${TAG#v}"
          PKG=$(node -p "require('./package.json').version")
          if [ "$PKG" != "$VERSION" ]; then
            echo "::error::Tag $TAG but package.json says $PKG. Bump package.json, commit, and re-tag."
            exit 1
          fi
          # The '## X.Y.Z — date' section, up to the next '## ' heading.
          awk -v v="$VERSION" '
            $0 ~ "^## " v "( |$)" { found=1; next }
            found && /^## / { exit }
            found { print }
          ' CHANGELOG.md > notes.md
          if ! grep -q '[^[:space:]]' notes.md; then
            echo "::error::CHANGELOG.md has no entry for $VERSION. Add a '## $VERSION — YYYY-MM-DD' section."
            exit 1
          fi
          # Title from the annotated tag's message; fall back to the version.
          git fetch --force origin "refs/tags/$TAG:refs/tags/$TAG"
          TITLE=$(git tag -l --format='%(contents:subject)' "$TAG")
          echo "TITLE=${TITLE:-$VERSION}" >> "$GITHUB_ENV"

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --title "$TITLE" --notes-file notes.md   # re-runs just refresh it
          else
            gh release create "$TAG" --title "$TITLE" --notes-file notes.md --verify-tag --latest
          fi
